<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" font-family="-apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6470"/>
    </marker>
    <style>
      .box { fill: #ffffff; stroke: #c9d1db; stroke-width: 1.5; }
      .key { fill: #fdf1f2; stroke: #d1495b; stroke-width: 1.8; }
      .title { font-size: 15px; font-weight: 600; fill: #1b1f24; }
      .text { font-size: 12.5px; fill: #4a525c; }
      .step { font-size: 11px; font-weight: 700; fill: #5b7aa6; letter-spacing: .06em; }
      .line { stroke: #5b6470; stroke-width: 1.6; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="960" height="330" fill="#f7f8fa" rx="14"/>

  <!-- 1. input -->
  <rect class="box" x="24" y="120" width="150" height="92" rx="10"/>
  <text class="step" x="40" y="143">1 · INPUT</text>
  <text class="title" x="40" y="166">Speech</text>
  <text class="text" x="40" y="186">mic window (4 s)</text>
  <text class="text" x="40" y="202">or audio file</text>

  <!-- 2. measure -->
  <rect class="box" x="214" y="120" width="170" height="92" rx="10"/>
  <text class="step" x="230" y="143">2 · MEASURE</text>
  <text class="title" x="230" y="166">Voice analysis</text>
  <text class="text" x="230" y="186">voice check (VAD), pitch,</text>
  <text class="text" x="230" y="202">loudness, tilt, HNR, rate…</text>

  <!-- 3a image -->
  <rect class="box" x="424" y="24" width="214" height="84" rx="10"/>
  <text class="step" x="440" y="47">3 · SHOW</text>
  <text class="title" x="440" y="70">Labelled plots (image)</text>
  <text class="text" x="440" y="90">spectrogram · pitch · loudness</text>

  <!-- 3b features -->
  <rect class="box" x="424" y="124" width="214" height="84" rx="10"/>
  <text class="step" x="440" y="147">3 · COMPARE</text>
  <text class="title" x="440" y="170">Features vs your baseline</text>
  <text class="text" x="440" y="190">“pitch +12 st, loudness +20 dB”</text>

  <!-- 3c guide -->
  <rect class="box" x="424" y="224" width="214" height="84" rx="10"/>
  <text class="step" x="440" y="247">3 · EXPLAIN</text>
  <text class="title" x="440" y="270">Cue guide</text>
  <text class="text" x="440" y="290">how each emotion sounds</text>

  <!-- 4 clef -->
  <rect class="key" x="678" y="104" width="128" height="124" rx="12"/>
  <text class="step" x="694" y="128" fill="#d1495b">4 · DECIDE</text>
  <text class="title" x="694" y="152">Cloudflare</text>
  <text class="title" x="694" y="170">Clef</text>
  <text class="text" x="694" y="192">decision model</text>
  <text class="text" x="694" y="208">(clef-flash)</text>

  <!-- 5 output -->
  <rect class="box" x="838" y="120" width="104" height="92" rx="10"/>
  <text class="step" x="852" y="143">5 · OUTPUT</text>
  <text class="text" x="852" y="166">emotion</text>
  <text class="text" x="852" y="183">probabilities</text>
  <text class="text" x="852" y="200">+ arousal</text>

  <!-- arrows -->
  <path class="line" d="M174,166 L210,166"/>
  <path class="line" d="M384,150 C404,150 404,66 420,66"/>
  <path class="line" d="M384,166 L420,166"/>
  <path class="line" d="M638,66 C660,66 656,140 674,140"/>
  <path class="line" d="M638,166 L674,166"/>
  <path class="line" d="M638,266 C660,266 656,192 674,192"/>
  <path class="line" d="M806,166 L834,166"/>
</svg>
